apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storage-manager-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: entorno.rural   # puedes inventar un host para desarrollo
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storage-manager
            port:
              number: 5567
